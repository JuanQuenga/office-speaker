name: Build

on:
  push:
    branches: [main, "ci/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    # ci/** branches iterate on the Windows test, so they skip this.
    if: ${{ !startsWith(github.ref, 'refs/heads/ci/') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v5
        with:
          name: office-speaker-mac
          path: dist/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - uses: actions/upload-artifact@v5
        with:
          name: office-speaker-windows
          # latest.yml and the blockmap are what auto-update reads.
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

  # Installs and runs the real installer on a real Windows machine.
  windows-smoke:
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v5
        with:
          name: office-speaker-windows
          path: smoke/current
      - name: Build the next version, for the update test
        id: next
        run: |
          next=$(node -p "const v=require('./package.json').version.split('.');v[2]=+v[2]+1;v.join('.')")
          npm version "$next" --no-git-tag-version --allow-same-version
          npm run dist:win
          mkdir -p smoke/next
          cp dist/*.exe dist/*.blockmap dist/latest.yml smoke/next/
          git checkout package.json package-lock.json
          echo "version=$next" >> "$GITHUB_OUTPUT"
      - name: Run the test
        run: node test/windows-smoke.mjs "$(ls smoke/current/*.exe)" smoke/next "${{ steps.next.outputs.version }}" smoke/results
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: windows-smoke-results
          path: smoke/results

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows, windows-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
          pattern: office-speaker-*
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
