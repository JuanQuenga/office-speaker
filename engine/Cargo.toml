[package]
name = "speaker-engine"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
librespot = { version = "=0.8.0", default-features = false, features = ["native-tls", "rodio-backend", "with-libmdns"] }
cpal = "0.16"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
futures-util = { version = "0.3", default-features = false }
log = "0.4"
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "sync", "io-std", "io-util", "time"] }

# macOS has Bonjour built in; announce through it instead of a second mDNS responder.
[target.'cfg(target_os = "macos")'.dependencies]
librespot = { version = "=0.8.0", default-features = false, features = ["with-dns-sd"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
