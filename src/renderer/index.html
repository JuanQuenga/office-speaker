<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' https://i.scdn.co data:; style-src 'self'; script-src 'self'"
    />
    <title>Office Speaker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="top">
      <img class="logo" src="../../assets/icon-256.png" alt="" />
      <div>
        <h1>Office Speaker</h1>
        <p id="status" class="status"><span class="dot"></span><span id="status-text">Starting…</span></p>
      </div>
    </header>

    <section id="idle" class="card idle">
      <p class="eyebrow">Visible in Spotify as</p>
      <div class="name-row">
        <p id="idle-name" class="speaker-name">Office Speaker</p>
        <button id="rename" class="link">Rename</button>
      </div>
      <ol class="steps">
        <li>Be on the same Wi-Fi as this computer.</li>
        <li>In Spotify, tap the <strong>devices</strong> icon.</li>
        <li>Pick <strong id="idle-name-inline">Office Speaker</strong>. Nobody has to sign in here.</li>
      </ol>
      <p class="fine">Needs Spotify Premium. If someone else picks the speaker, they take over.</p>
    </section>

    <section id="playing" class="card playing" hidden>
      <div class="now">
        <img id="cover" class="cover" alt="" />
        <div class="meta">
          <p id="title" class="title"></p>
          <p id="artist" class="artist"></p>
          <p id="client" class="client"></p>
        </div>
      </div>
      <div class="controls">
        <button class="icon-btn" data-command="prev" aria-label="Previous track">
          <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z" /></svg>
        </button>
        <button id="toggle" class="icon-btn primary" aria-label="Play or pause">
          <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg>
          <svg id="icon-pause" viewBox="0 0 24 24" hidden><path d="M6 5h4v14H6zM14 5h4v14h-4z" /></svg>
        </button>
        <button class="icon-btn" data-command="next" aria-label="Next track">
          <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z" /></svg>
        </button>
      </div>
      <label class="volume">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z" /></svg>
        <input id="volume" type="range" min="0" max="100" step="1" aria-label="Volume" />
      </label>
      <button id="disconnect" class="link danger">Disconnect listener</button>
    </section>

    <p id="message" class="message" hidden></p>

    <details id="settings-panel" class="card settings">
      <summary>Settings</summary>
      <form id="settings">
      <label class="field">
        <span>Speaker name</span>
        <input id="name" maxlength="60" autocomplete="off" spellcheck="false" />
      </label>
      <label class="field">
        <span>Play through</span>
        <select id="output"></select>
      </label>
      <label class="field">
        <span>Quality</span>
        <select id="bitrate">
          <option value="320">High (320 kbps)</option>
          <option value="160">Normal (160 kbps)</option>
          <option value="96">Low (96 kbps)</option>
        </select>
      </label>
      <label class="toggle">
        <input id="normalize" type="checkbox" />
        <span>Keep loudness even between songs</span>
      </label>
      <label class="toggle">
        <input id="login" type="checkbox" />
        <span>Start when this computer starts</span>
      </label>
      <div class="actions">
        <span id="save-note" class="fine"></span>
        <button id="save" type="submit" class="button" disabled>Save</button>
      </div>
      </form>
    </details>

    <footer>
      <span id="version"></span>
      <button id="logs" class="link">Copy logs</button>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
